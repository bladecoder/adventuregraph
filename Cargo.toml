[workspace]
resolver = "2"
members = ["esp", "simulator"]

[workspace.package]
name = "adventuregraph"
version = "0.1.0"
authors = ["Rafael García <bladecoder@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bladecoder/adventuregraph"

[workspace.dependencies]
#core = { path = "core", version = "0.1.0" }

ratatui = { version = "0.29.0", default-features = false }
tui-big-text = "=0.7.3"
log = "0.4"

[profile.release]
opt-level = 3

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"
