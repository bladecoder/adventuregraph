[workspace]
resolver = "2"
members = ["core", "esp", "simulator", "tui"]

[workspace.package]
version = "0.1.0"
authors = ["Rafael García <bladecoder@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bladecoder/adventuregraph"

[workspace.dependencies]
anyhow = "1.0.100"
bladeink = "1.2.1"
log = { version = "0.4", default-features = false }
mousefood = "0.2.1"
ratatui = { version = "0.29.0", default-features = false }
tui-big-text = "=0.7.3"
crossterm = "0.27"
tui-widget-list = "0.13.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package.adventuregraph-esp]
opt-level = "s"

[profile.dev.package.adventuregraph-esp]
opt-level = "z"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"
